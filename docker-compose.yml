services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin-swarm
    user: ${uid}:${gid}
    ports:
    - target: 8096
      published: 8096
      protocol: tcp
      mode: host
    - target: 7359
      published: 7359
      protocol: udp
      mode: host
    - target: 8920
      published: 8920
      protocol: tcp
      mode: host
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.labels.deployment.target.jellyfin == true
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: continue
        monitor: 60s
        max_failure_ratio: 0.3
    volumes:
    - /var/lib/docker/volumes/jellyfin_swarm/config:/config
    - /var/lib/docker/volumes/jellyfin_swarm/cache:/cache
    - /media/Multimedia:/media
    environment:
    - JELLYFIN_PublishedServerUrl=https://jelly.echoinggreen.net
volumes: {}
